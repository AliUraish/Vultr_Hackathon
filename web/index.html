<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>Replay · Fleet Incident Lab</title>
  <link rel="stylesheet" href="/static/style.css">
  <script type="importmap">{"imports": {"three": "/static/vendor/three/three.module.min.js", "three/addons/": "/static/vendor/three/addons/"}}</script>
</head>
<body>
  <header class="topbar">
    <div class="brand" id="brand"><span class="logo">⟲</span> Replay <span class="sub" id="site-chip">fleet incident lab</span></div>
    <nav id="nav">
      <a href="#/live" data-view="live">Live</a>
      <a href="#/floor" data-view="floor">Map</a>
      <a href="#/incidents" data-view="incidents">Incidents<span id="inbox-badge" class="badge" hidden></span></a>
      <a href="#/regression" data-view="regression">Regression</a>
      <a href="#/log" data-view="log">Event log</a>
      <a href="#/policy" data-view="policy">Policy</a>
      <a href="#/platform" data-view="platform">Platform</a>
    </nav>
    <div class="status">
      <span id="policy-chip" class="chip mono">policy –</span>
      <span id="sim-chip" class="chip"><span class="dot"></span><span id="sim-text">sim offline</span></span>
      <span class="chip mono">t <span id="tick-num" data-v="0">–</span></span>
      <button id="logout" style="height:28px;padding:0 11px;font-size:12px">Sign out</button>
    </div>
  </header>

  <main>
    <section id="view-live" hidden></section>
    <section id="view-floor" hidden></section>
    <section id="view-incidents" hidden></section>
    <section id="view-incident" hidden></section>
    <section id="view-regression" hidden></section>
    <section id="view-log" hidden></section>
    <section id="view-policy" hidden></section>
    <section id="view-platform" hidden></section>
  </main>

  <aside id="inspector" class="drawer"></aside>

  <div id="login" class="overlay" hidden>
    <form id="login-form" class="panel login glow">
      <div class="brand"><span class="logo">⟲</span> Replay</div>
      <div class="hint">Fleet incident lab · sign in</div>
      <input id="login-user" placeholder="username" autocomplete="username" required>
      <input id="login-pass" type="password" placeholder="password" autocomplete="current-password" required>
      <button type="submit" class="primary">Sign in</button>
      <div id="login-error" class="error"></div>
    </form>
  </div>
  <div id="toasts"></div>
  <script type="module" src="/static/js/app.js"></script>
</body>
</html>
